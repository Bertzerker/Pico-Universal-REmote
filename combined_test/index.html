<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Remote</title>
<style>body{font:17px system-ui;background:#101827;color:#eef4fb;max-width:440px;margin:auto;padding:18px}h1{font-size:26px}p{color:#bac9db}button,input{font:inherit;border-radius:10px;padding:13px;box-sizing:border-box}button{border:0;background:#55d6be;color:#092225;min-height:52px;cursor:pointer}button:disabled{opacity:.4}input{background:#203149;border:1px solid #5c7998;color:white;width:100%}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px auto;max-width:310px}.grid button{min-height:66px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.ok{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.pad{height:190px;border:2px solid #5c7998;border-radius:18px;background:#203149;display:grid;place-items:center;touch-action:none;user-select:none}.pad.active{border-color:#55d6be}.hidden{display:none}.secondary{background:#adbed3}.status{min-height:24px}</style>
<h1>TV Remote</h1><p id="status" class="status">Connecting…</p>
<div id="login"><input id="password" type="password" autocomplete="current-password" placeholder="Web login password"><div class="row"><button id="loginButton">Log in</button></div></div>
<div id="remote" class="hidden"><div class="row"><button data-key="back">Back</button><button data-key="home">Home</button><button data-key="play_pause">Play / Pause</button></div><div class="grid"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="ok" data-key="select">OK</button><button class="right" data-key="right">▶</button><button class="down" data-key="down">▼</button></div><div class="row"><button data-key="volume_down">Vol −</button><button data-key="mute">Mute</button><button data-key="volume_up">Vol +</button></div><div class="row"><input id="text" maxlength="80" placeholder="Type in focused TV field"><button id="sendText">Send</button></div><p>Touchpad</p><div id="pad" class="pad">Slide to move pointer · tap to click</div><div class="row"><button data-key="mouse_click">Mouse 1 · Click</button></div><button id="logout" class="secondary">Log out</button></div>
<script>const $=id=>document.getElementById(id);let token=sessionStorage.getItem('tvToken')||'',connected=false,drag=null,movement={x:0,y:0},moving=false;
async function request(path,body){const headers={};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{method:body===undefined?'GET':'POST',headers,body});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function message(text){$('status').textContent=text}function show(){ $('login').classList.toggle('hidden',!!token);$('remote').classList.toggle('hidden',!token)}
async function status(){if(!token){show();message('Log in to control the TV');return}try{const data=await request('/api/status');connected=data.connected;message(connected?'TV connected via Bluetooth':'Waiting for TV Bluetooth connection');for(const button of document.querySelectorAll('[data-key],#sendText'))button.disabled=!connected;show()}catch(e){token='';sessionStorage.removeItem('tvToken');connected=false;show();message(e.message)}}
$('loginButton').onclick=async()=>{try{const data=await request('/api/login',$('password').value);token=data.token;sessionStorage.setItem('tvToken',token);$('password').value='';await status()}catch(e){message(e.message)}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginButton').click()};
$('logout').onclick=()=>{token='';sessionStorage.removeItem('tvToken');status()};
async function send(path,body){try{await request(path,body);message('Sent to TV')}catch(e){message(e.message);if(e.message==='Please log in')status()}}
for(const button of document.querySelectorAll('[data-key]'))button.onclick=()=>send('/api/key',button.dataset.key);
$('sendText').onclick=()=>{if($('text').value)send('/api/text',$('text').value)};$('text').onkeydown=e=>{if(e.key==='Enter')$('sendText').click()};
async function flush(){if(moving||(!movement.x&&!movement.y))return;moving=true;const x=Math.max(-127,Math.min(127,movement.x)),y=Math.max(-127,Math.min(127,movement.y));movement.x-=x;movement.y-=y;try{await request('/api/move',x+','+y)}catch(e){movement.x+=x;movement.y+=y;if(e.message!=='TV disconnected, busy, or invalid move'){message(e.message);movement={x:0,y:0}}}moving=false;if(movement.x||movement.y)setTimeout(flush,85)}
$('pad').onpointerdown=e=>{if(!connected)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};$('pad').setPointerCapture(e.pointerId);$('pad').classList.add('active')};
$('pad').onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;const x=Math.round(e.clientX-drag.x),y=Math.round(e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;if(x||y){drag.moved=true;movement.x+=x;movement.y+=y;flush()}};
$('pad').onpointerup=e=>{if(!drag||e.pointerId!==drag.id)return;const tap=!drag.moved;drag=null;$('pad').classList.remove('active');if(tap)send('/api/key','mouse_click')};
status();setInterval(()=>{if(token)status()},5000);</script></html>
